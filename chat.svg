<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480">
  <defs>
    <style>
      .bubble { opacity: 0; animation: fadeSlideIn 0.5s ease forwards; }
      .dot { animation: blink 1.2s infinite ease-in-out; fill: #8b949e; }
      .dot1 { animation-delay: 0s; }
      .dot2 { animation-delay: 0.2s; }
      .dot3 { animation-delay: 0.4s; }
      @keyframes blink {
        0%, 80%, 100% { opacity: 0.2; transform: translateY(0px); }
        40% { opacity: 1; transform: translateY(-4px); }
      }
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .header-bar { opacity: 0; animation: fadeSlideIn 0.4s ease 0.1s forwards; }
      .b1 { animation-delay: 0.6s; }
      .b2 { animation-delay: 1.4s; }
      .b3 { animation-delay: 2.2s; }
      .b4 { animation-delay: 3.0s; }
      .b5 { animation-delay: 3.8s; }
      .typing1 { opacity: 0; animation: fadeSlideIn 0.3s ease 0.3s forwards, hideTyping 0.3s ease 0.55s forwards; }
      .typing2 { opacity: 0; animation: fadeSlideIn 0.3s ease 1.1s forwards, hideTyping 0.3s ease 1.35s forwards; }
      .typing3 { opacity: 0; animation: fadeSlideIn 0.3s ease 1.9s forwards, hideTyping 0.3s ease 2.15s forwards; }
      .typing4 { opacity: 0; animation: fadeSlideIn 0.3s ease 2.7s forwards, hideTyping 0.3s ease 2.95s forwards; }
      .typing5 { opacity: 0; animation: fadeSlideIn 0.3s ease 3.5s forwards, hideTyping 0.3s ease 3.75s forwards; }
      @keyframes hideTyping { from { opacity: 1; } to { opacity: 0; } }
      .badge-dot { animation: pulse 2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2330"/>
      <stop offset="100%" stop-color="#161b27"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="480" fill="#0d1117" rx="16"/>
  <rect width="598" height="478" x="1" y="1" fill="none" stroke="#30363d" stroke-width="1" rx="15"/>

  <!-- Header -->
  <g class="header-bar">
    <rect width="600" height="56" fill="url(#hG)" rx="16"/>
    <rect y="40" width="600" height="16" fill="url(#hG)"/>
    <rect y="55" width="600" height="1" fill="#30363d"/>
    <circle cx="38" cy="28" r="16" fill="#1d4ed8"/>
    <text x="38" y="34" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="white">MF</text>
    <text x="62" y="24" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Marcelo Fernandes</text>
    <text x="62" y="40" font-family="Inter,sans-serif" font-size="11" fill="#8b949e">Senior Software Engineer · TopSaude HUB</text>
    <circle cx="50" cy="40" r="5" fill="#238636" class="badge-dot"/>
    <circle cx="50" cy="40" r="5" fill="none" stroke="#0d1117" stroke-width="2"/>
  </g>

  <!-- Typing 1 -->
  <g class="typing1" transform="translate(20, 70)">
    <rect width="68" height="32" rx="16" fill="#1e2330"/>
    <circle cx="18" cy="16" r="4" class="dot dot1"/>
    <circle cx="34" cy="16" r="4" class="dot dot2"/>
    <circle cx="50" cy="16" r="4" class="dot dot3"/>
  </g>

  <!-- Bubble 1: Greeting -->
  <g class="bubble b1" filter="url(#shadow)">
    <rect x="20" y="70" width="320" height="46" rx="20" fill="url(#nG)" filter="url(#glow)"/>
    <text x="40" y="89" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="white">Hi, I am Marcelo Fernandes &#x1F44B;</text>
    <text x="40" y="107" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">Senior Software Engineer · Teresopolis, RJ, Brazil &#x1F1E7;&#x1F1F7;</text>
  </g>

  <!-- Typing 2 -->
  <g class="typing2" transform="translate(20, 132)">
    <rect width="68" height="32" rx="16" fill="#1e2330"/>
    <circle cx="18" cy="16" r="4" class="dot dot1"/>
    <circle cx="34" cy="16" r="4" class="dot dot2"/>
    <circle cx="50" cy="16" r="4" class="dot dot3"/>
  </g>

  <!-- Bubble 2: Stack -->
  <g class="bubble b2" filter="url(#shadow)">
    <rect x="20" y="132" width="430" height="52" rx="20" fill="url(#bG)"/>
    <rect x="20" y="132" width="3" height="52" rx="2" fill="#58a6ff"/>
    <text x="36" y="152" font-family="Inter,sans-serif" font-size="11" fill="#8b949e">&#x1F6E0; Stack</text>
    <text x="36" y="171" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#e6edf3">.NET · Oracle PL/SQL · React · TypeScript · Docker · RabbitMQ</text>
  </g>

  <!-- Typing 3 -->
  <g class="typing3" transform="translate(20, 200)">
    <rect width="68" height="32" rx="16" fill="#1e2330"/>
    <circle cx="18" cy="16" r="4" class="dot dot1"/>
    <circle cx="34" cy="16" r="4" class="dot dot2"/>
    <circle cx="50" cy="16" r="4" class="dot dot3"/>
  </g>

  <!-- Bubble 3: Focus -->
  <g class="bubble b3" filter="url(#shadow)">
    <rect x="20" y="200" width="410" height="52" rx="20" fill="url(#bG)"/>
    <rect x="20" y="200" width="3" height="52" rx="2" fill="#3fb950"/>
    <text x="36" y="220" font-family="Inter,sans-serif" font-size="11" fill="#8b949e">&#x1F3E5; Focus</text>
    <text x="36" y="239" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#e6edf3">Building reliable, high-performance systems for healthcare</text>
  </g>

  <!-- Typing 4 -->
  <g class="typing4" transform="translate(20, 268)">
    <rect width="68" height="32" rx="16" fill="#1e2330"/>
    <circle cx="18" cy="16" r="4" class="dot dot1"/>
    <circle cx="34" cy="16" r="4" class="dot dot2"/>
    <circle cx="50" cy="16" r="4" class="dot dot3"/>
  </g>

  <!-- Bubble 4: Expertise -->
  <g class="bubble b4" filter="url(#shadow)">
    <rect x="20" y="268" width="460" height="64" rx="20" fill="url(#bG)"/>
    <rect x="20" y="268" width="3" height="64" rx="2" fill="#f0883e"/>
    <text x="36" y="288" font-family="Inter,sans-serif" font-size="11" fill="#8b949e">&#x1F4A1; Expertise</text>
    <text x="36" y="307" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#e6edf3">REST APIs · SOAP · PL/SQL Optimization · TISS (ANS)</text>
    <text x="36" y="323" font-family="Inter,sans-serif" font-size="12" fill="#8b949e">Migrations · Legacy refactoring · Health operator integrations</text>
  </g>

  <!-- Typing 5 -->
  <g class="typing5" transform="translate(20, 348)">
    <rect width="68" height="32" rx="16" fill="#1e2330"/>
    <circle cx="18" cy="16" r="4" class="dot dot1"/>
    <circle cx="34" cy="16" r="4" class="dot dot2"/>
    <circle cx="50" cy="16" r="4" class="dot dot3"/>
  </g>

  <!-- Bubble 5: Contact -->
  <g class="bubble b5" filter="url(#shadow)">
    <rect x="20" y="348" width="390" height="46" rx="20" fill="url(#bG)"/>
    <rect x="20" y="348" width="3" height="46" rx="2" fill="#bc8cff"/>
    <text x="36" y="368" font-family="Inter,sans-serif" font-size="11" fill="#8b949e">&#x1F517; Let us connect</text>
    <text x="36" y="385" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#58a6ff">linkedin.com/in/fernandes-marcelo</text>
  </g>

  <!-- Tech tags -->
  <g class="bubble b5">
    <rect x="20" y="410" width="52" height="24" rx="10" fill="#1a2a4a"/>
    <text x="46" y="426" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">.NET</text>
    <rect x="80" y="410" width="56" height="24" rx="10" fill="#1a3a2a"/>
    <text x="108" y="426" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#3fb950">React</text>
    <rect x="144" y="410" width="62" height="24" rx="10" fill="#3a1a1a"/>
    <text x="175" y="426" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#f85149">Oracle</text>
    <rect x="214" y="410" width="62" height="24" rx="10" fill="#1a2a3a"/>
    <text x="245" y="426" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#79c0ff">Docker</text>
    <rect x="284" y="410" width="80" height="24" rx="10" fill="#1a2a4a"/>
    <text x="324" y="426" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#58a6ff">TypeScript</text>
    <rect x="372" y="410" width="80" height="24" rx="10" fill="#2a1a2a"/>
    <text x="412" y="426" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#bc8cff">RabbitMQ</text>
    <text x="20" y="458" font-family="Inter,sans-serif" font-size="10" fill="#484f58">Passionate about clean code, performance and real-world impact &#x2728;</text>
  </g>
</svg>
